<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>judh — 콘텐츠 편집</title><link rel="stylesheet" href="style.css?v=fe9374fd446a"><link rel="stylesheet" href="editor.css?v=cms-1"><link rel="icon" href="assets/symbol.svg?v=c37ba225353f" type="image/svg+xml">
</head>
<body class="editor-gate-body">
<main class="editor-gate" aria-labelledby="login-title">
<a class="brand" href="index.html">judh</a>
<p class="eyebrow">PRIVATE EDITOR</p>
<h1 id="login-title">콘텐츠 편집</h1>
<p class="login-description">등록된 관리자 계정으로 로그인하세요. 저장하면 모든 방문자에게 반영됩니다.</p>
<form id="editor-login">
<label for="editor-email">이메일</label><input id="editor-email" name="email" type="email" autocomplete="username" required><label for="editor-password">비밀번호</label>
<div class="password-field"><input id="editor-password" name="password" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required autofocus><button type="button" id="show-password" aria-controls="editor-password" aria-pressed="false">보기</button></div>
<p id="login-status" role="status" aria-live="polite"></p>
<button id="unlock-editor" type="submit">로그인 <span aria-hidden="true">↗</span></button>
</form>
<a href="index.html" class="login-back">사이트로 돌아가기</a>
<noscript><p>암호를 확인하려면 브라우저의 JavaScript를 켜 주세요.</p></noscript>
</main>
<script src="portfolio-data.js?v=9f3b1b1c3213"></script><script src="cms-config.js?v=cms-1"></script><script src="assets/editor-gate.bundle.js?v=cms-1"></script>
</body></html>
